server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Pages always ask whether there's a newer version, so an update shows
    # up at once instead of the browser reusing its old copy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html =404;
    }

    # Astro's hashed files never change.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
